<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Bee Nix // Suture Blue</title>
  <meta name="description" content="Bee Nix (Suture Blue): artist-researcher working with/in systems. Glitch art, animation, games, curation, and conversations."/>
  <link rel="icon" href="assets/favicon.png" type="image/png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #050f0f;
      overflow: hidden;
    }

    body {
      font-family: 'Share Tech Mono', monospace;
      user-select: none;
    }

    /* -- WRAP (full viewport) --------------------------- */
    .wrap {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: #050f0f;
    }

    .wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(10,124,140,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10,124,140,0.06) 1px, transparent 1px);
      background-size: 22px 22px;
      pointer-events: none;
    }

    /* corner marks */
    .corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: rgba(10,124,140,0.3);
      border-style: solid;
      border-width: 0;
    }
    .corner.tl { top: 10px; left: 10px; border-top-width: 1.5px; border-left-width: 1.5px; }
    .corner.tr { top: 10px; right: 10px; border-top-width: 1.5px; border-right-width: 1.5px; }
    .corner.bl { bottom: 10px; left: 10px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
    .corner.br { bottom: 10px; right: 10px; border-bottom-width: 1.5px; border-right-width: 1.5px; }

    /* -- CORNER BUTTONS --------------------------------- */
    /* HOME -- top-left, shown only on a subpage */
    #homeBtn {
      position: absolute;
      top: 22px;
      left: 22px;
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: #ffffff;
      border: 2px solid var(--sp-link, #0a7c8c);
      color: var(--sp-link, #0a7c8c);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      padding: 0;
      transition: background 0.18s, color 0.18s, border-color 0.18s;
    }
    #homeBtn.vis { display: flex; }
    #homeBtn:hover { background: var(--sp-link, #0a7c8c); color: #ffffff; }
    #homeBtn svg { width: 20px; height: 20px; display: block; }

    /* THEME -- top-right, always present, just a swatch dot */
    #themeBtn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: none;
      border: none;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      z-index: 40;
    }
    .theme-swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: #0a7c8c;
      pointer-events: none;
      transition: border-color 0.2s, opacity 0.2s;
      opacity: 0.35;
    }
    #themeBtn:hover .theme-swatch,
    #themeBtn:focus-visible .theme-swatch { border-color: rgba(255,255,255,0.8); opacity: 0.75; }

    @keyframes rainbow-spin {
      0%   { background: hsl(0,70%,60%); }
      14%  { background: hsl(50,80%,58%); }
      28%  { background: hsl(110,65%,48%); }
      42%  { background: hsl(170,70%,48%); }
      57%  { background: hsl(220,70%,62%); }
      71%  { background: hsl(270,65%,60%); }
      85%  { background: hsl(320,70%,58%); }
      100% { background: hsl(360,70%,60%); }
    }
    .theme-swatch.rainbow { animation: rainbow-spin 3s linear infinite; }

    /* keyboard focus ring for HTML controls */
    button:focus-visible, a:focus-visible, .cell:focus-visible {
      outline: 2px solid var(--sp-tx, #5ec8d4);
      outline-offset: 2px;
    }

    /* -- VIEWS ------------------------------------------ */
    .view {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s;
    }
    .view.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
    .view svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* -- SVG INTERACTIVITY ------------------------------ */
    .nd { cursor: pointer; outline: none; }
    .nhalo { opacity: 0; transition: opacity 0.2s; }
    .nd:hover .nhalo,
    .nd:focus-visible .nhalo,
    .nhalo.on { opacity: 1; }
    .tr { transition: stroke 0.4s, stroke-opacity 0.4s, filter 0.4s; }
    .tr.lit {
      stroke: #0a7c8c;
      stroke-opacity: 1;
      filter: drop-shadow(0 0 4px rgba(10,124,140,0.7));
    }

    /* -- PANEL ------------------------------------------ */
    .panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 80px);
      max-width: 480px;
      max-height: calc(100% - 60px);
      background: var(--sp-bg, rgba(4,14,14,0.98));
      border: 1px solid var(--sp-bd, rgba(10,124,140,0.5));
      border-radius: 10px;
      overflow: hidden;
      display: none;
      flex-direction: column;
      z-index: 20;
    }
    .panel.vis {
      display: flex;
      animation: pop 0.2s ease forwards;
    }
    @keyframes pop {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.97); }
      to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    .p-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--sp-hbg, rgba(10,124,140,0.15));
      border-bottom: 1px solid var(--sp-hbd, rgba(10,124,140,0.4));
      padding: 9px 12px;
    }
    .p-header-title {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--sp-tx, rgba(94,200,212,0.95));
      font-weight: 700;
    }
    .p-close {
      background: #ffffff;
      border: 2px solid var(--sp-link, #0a7c8c);
      border-radius: 4px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--sp-link, #0a7c8c);
      font-size: 13px;
      cursor: pointer;
      font-family: 'Share Tech Mono', monospace;
      line-height: 1;
      padding: 0;
      transition: background 0.18s, color 0.18s;
      flex-shrink: 0;
    }
    .p-close:hover { background: var(--sp-link, #0a7c8c); color: #ffffff; }

    .panel-body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--sp-acc, rgba(10,124,140,0.4)) transparent;
    }
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-thumb { background: var(--sp-acc, rgba(10,124,140,0.4)); border-radius: 2px; }

    .panel-inner { display: flex; gap: 14px; align-items: flex-start; }
    .panel-text  { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }

    .p-desc {
      font-size: 13px;
      color: var(--sp-desc, rgba(180,225,220,0.9));
      line-height: 1.7;
      letter-spacing: 0.3px;
      user-select: text;
    }

    .panel-img {
      flex: 0 0 auto;
      width: clamp(100px, 28%, 160px);
      min-height: 130px;
      max-height: 200px;
      align-self: stretch;
      border-radius: 6px;
      border: 1px solid var(--sp-bd, rgba(10,124,140,0.4));
      background: var(--sp-ibg, #0a1e1e);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel-img img  { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* -- SUB-ITEM PANEL (detail panel for gallery cells) - */
    .sub-panel {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 60px);
      max-width: 520px;
      max-height: calc(100% - 60px);
      background: var(--sp-bg, rgba(4,14,14,0.98));
      border: 1px solid var(--sp-bd, rgba(10,124,140,0.5));
      border-radius: 10px;
      overflow: hidden;
      display: none;
      flex-direction: column;
      z-index: 25;
    }
    .sub-panel.vis { display: flex; animation: pop 0.2s ease forwards; }
    .sub-panel .p-header-title { font-size: 12px; letter-spacing: 2px; }
    .sub-panel-body { flex: 1 1 auto; overflow-y: auto; padding: 16px; scrollbar-width: thin; scrollbar-color: var(--sp-acc, rgba(10,124,140,0.4)) transparent; }
    .sub-panel-body::-webkit-scrollbar { width: 4px; }
    .sub-panel-body::-webkit-scrollbar-thumb { background: var(--sp-acc, rgba(10,124,140,0.4)); border-radius: 2px; }
    .sub-panel-inner { display: flex; flex-direction: column; gap: 14px; }
    .sub-panel-kicker { font-size: 9px; letter-spacing: 2.5px; color: var(--sp-ph, rgba(10,124,140,0.7)); }
    .sub-panel-text { font-size: 12px; color: var(--sp-desc, rgba(180,225,220,0.9)); line-height: 1.7; letter-spacing: 0.3px; user-select: text; }
    .sub-panel-text a { color: var(--sp-link, #0a7c8c); text-decoration: none; border-bottom: 1px solid var(--sp-bd, rgba(10,124,140,0.4)); }
    .sub-panel-text a:hover { color: var(--sp-tx, #5ec8d4); }
    .sub-panel-text em { color: var(--sp-tx, #5ec8d4); font-style: normal; }
    .sub-panel-img { width: 100%; max-height: 180px; border-radius: 6px; border: 1px solid var(--sp-bd, rgba(10,124,140,0.35)); background: var(--sp-ibg, #0a1e1e); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .sub-panel-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sub-panel-embed { width: 100%; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; border: 1px solid var(--sp-bd, rgba(10,124,140,0.35)); background: #000; }
    .sub-panel-embed iframe { width: 100%; height: 100%; border: none; display: block; }
    .sub-panel-img-ph { font-size: 10px; color: var(--sp-ph, rgba(10,124,140,0.5)); text-align: center; letter-spacing: 1px; padding: 20px; }

    /* about CV link */
    .cv-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #0a7c8c;
      background: #ffffff;
      border: 2px solid #0a7c8c;
      border-radius: 4px;
      padding: 4px 10px;
      text-decoration: none;
      font-family: 'Share Tech Mono', monospace;
      transition: background 0.18s, color 0.18s;
    }
    .cv-link:hover { background: #0a7c8c; color: #ffffff; }

    /* -- SUB GALLERY (component tray) ------------------- */
    #subGallery {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 28px 40px;
    }
    #subGallery.vis { display: flex; }

    .tray-head {
      flex: 0 0 auto;
      text-align: center;
      margin-bottom: 22px;
      max-width: 540px;
      padding: 0 12px;
    }
    .tray-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      letter-spacing: 4px;
      color: var(--sp-tx, #5ec8d4);
      font-weight: 700;
    }
    .tray-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.5px;
      line-height: 1.6;
      color: var(--sp-desc, rgba(180,225,220,0.75));
      margin-top: 10px;
    }

    /* subsection divider row inside the grid */
    .tray-section {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 2px 0;
    }
    .tray-section::before,
    .tray-section::after {
      content: "";
      flex: 1 1 24px;
      height: 1px;
      background: var(--cell-bd, rgba(10,124,140,0.35));
    }
    .tray-section span {
      font-size: 8px;
      letter-spacing: 3px;
      color: var(--sp-ph, rgba(10,124,140,0.6));
      font-family: 'Share Tech Mono', monospace;
      text-align: center;
      line-height: 1.6;
      max-width: 80%;
    }

    .tray-grid {
      flex: 0 1 auto;
      display: grid;
      gap: 14px;
      width: 100%;
      max-width: 720px;
      max-height: 100%;
      overflow-y: auto;
      padding: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--sp-acc, rgba(10,124,140,0.4)) transparent;
      /* at most 3 cards per row (fewer on narrow screens) */
      grid-template-columns: repeat(auto-fill, minmax(max(150px, calc((100% - 28px) / 3)), 1fr));
      /* keep rows at full size so the grid scrolls instead of squashing
         cells (aspect-ratio + overflow:hidden lets thumbnails collapse) */
      grid-auto-rows: max-content;
    }
    .tray-grid::-webkit-scrollbar { width: 4px; }
    .tray-grid::-webkit-scrollbar-thumb { background: var(--sp-acc, rgba(10,124,140,0.4)); border-radius: 2px; }

    /* one component cell */
    .cell {
      position: relative;
      cursor: pointer;
      background: var(--sp-bg2, #071515);
      border: 1px solid var(--cell-bd, rgba(10,124,140,0.35));
      border-radius: 5px;
      overflow: hidden;
      transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
    }
    .cell:hover, .cell:focus-visible {
      border-color: var(--sp-link, #0a7c8c);
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px var(--sp-link, #0a7c8c),
                  0 6px 18px -8px var(--cell-glow, rgba(10,124,140,0.6));
    }

    /* 4:3 thumbnail */
    .cell-thumb {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--sp-ibg, #0a1e1e);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .cell-thumb img, .cell-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cell-thumb img { transition: transform 0.25s; }
    .cell:hover .cell-thumb img { transform: scale(1.05); }
    /* placeholder when a cell has no image -- silkscreen look */
    .cell-thumb-ph {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--sp-ph, rgba(10,124,140,0.55));
      text-align: center;
      padding: 12px;
      line-height: 1.8;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        repeating-linear-gradient(45deg,
          var(--cell-hatch, rgba(10,124,140,0.06)) 0 6px,
          transparent 6px 12px);
    }
    /* small tag in the thumbnail corner, e.g. "TALK", "ESSAY" */
    .cell-kind {
      position: absolute;
      top: 6px;
      left: 6px;
      font-size: 7.5px;
      letter-spacing: 1.5px;
      color: #ffffff;
      background: var(--sp-bg, rgba(4,14,14,0.85));
      border: 1px solid var(--cell-bd, rgba(10,124,140,0.5));
      border-radius: 3px;
      padding: 2px 5px;
      pointer-events: none;
    }

    /* label strip under the thumbnail */
    .cell-label {
      font-size: 9.5px;
      letter-spacing: 1px;
      color: #ffffff;
      font-weight: 700;
      text-align: center;
      padding: 8px 6px;
      border-top: 1px solid var(--cell-bd, rgba(10,124,140,0.25));
      line-height: 1.35;
      background: var(--sp-bg2, #071515);
    }

    /* -- SOCIAL ICON BUTTONS --------------------------- */
    .social-btn {
      display: inline-block;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: 2px solid #0a7c8c;
      background: #ffffff;
      overflow: hidden;
      vertical-align: middle;
      margin-left: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.18s;
    }
    .social-btn:hover { opacity: 0.8; }
    .social-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- corner buttons -->
  <button id="themeBtn" onclick="cycleTheme()" title="Change theme" aria-label="Change color theme"><span class="theme-swatch" id="themeSwatch"></span></button>
  <button id="homeBtn" onclick="goHome()" title="Home" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h5v-5h4v5h5v-9"/></svg>
  </button>

  <!-- ==============================================
       MAIN VIEW
  =============================================== -->
  <div id="viewMain" class="view">
    <svg viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Bee Nix site map">
      <defs>
        <filter id="gl"><feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="glb"><feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <!-- MAKING/THINKING top-left -> center right-angle -->
      <polyline id="tr-making-thinking" class="tr" points="200,120 200,266 254,266 254,300" fill="none" stroke="rgba(10,124,140,0.2)" stroke-width="2" stroke-linecap="square"/>
      <!-- GATHERING/SHARING right -> center -->
      <polyline id="tr-gathering-sharing" class="tr" points="430,300 346,300" fill="none" stroke="rgba(10,124,140,0.2)" stroke-width="2" stroke-linecap="square"/>
      <!-- DISCUSSING bottom -> center -->
      <polyline id="tr-discussing"        class="tr" points="300,354 300,432" fill="none" stroke="rgba(10,124,140,0.2)" stroke-width="2" stroke-linecap="square"/>
      <!-- junction dot -->
      <circle id="junction" cx="254" cy="266" r="3" fill="rgba(10,124,140,0.25)"/>
      <!-- CENTER -->
      <g class="nd" id="nd-center" data-action="center" tabindex="0" role="button" aria-label="About Bee Nix">
        <circle cx="300" cy="300" r="54" fill="none" stroke="rgba(10,124,140,0.16)" stroke-width="1.2" stroke-dasharray="5 3"/>
        <circle cx="300" cy="300" r="46" fill="#071515" stroke="#0a7c8c" stroke-width="1.5" filter="url(#gl)"/>
        <circle class="nhalo" id="h-center" cx="300" cy="300" r="52" fill="none" stroke="#0a7c8c" stroke-width="2" filter="url(#glb)"/>
        <circle cx="300" cy="300" r="38" fill="#0a1e1e"/>
        <text x="300" y="293" text-anchor="middle" font-size="14" fill="#5ec8d4" letter-spacing="2" font-family="'Share Tech Mono',monospace">BEE NIX</text>
        <text x="300" y="311" text-anchor="middle" font-size="10" fill="rgba(94,200,212,0.5)" letter-spacing="1" font-family="'Share Tech Mono',monospace">SUTURE.BLUE</text>
      </g>
      <!-- MAKING/THINKING -- IC chip, top-left -->
      <g class="nd" id="nd-making_thinking" data-action="making_thinking" tabindex="0" role="button" aria-label="Making / Thinking">
        <rect x="142" y="92" width="116" height="56" rx="3" fill="#071515" stroke="rgba(10,124,140,0.3)" stroke-width="1"/>
        <rect class="nhalo" id="h-making_thinking" x="137" y="87" width="126" height="66" rx="5" fill="none" stroke="#0a7c8c" stroke-width="1.5" filter="url(#glb)"/>
        <path d="M142,112 Q136,120 142,128" fill="none" stroke="rgba(10,124,140,0.4)" stroke-width="1"/>
        <line x1="142" y1="102" x2="128" y2="102" stroke="rgba(10,124,140,0.4)" stroke-width="1.5"/>
        <line x1="142" y1="112" x2="128" y2="112" stroke="rgba(10,124,140,0.4)" stroke-width="1.5"/>
        <line x1="142" y1="122" x2="128" y2="122" stroke="rgba(10,124,140,0.4)" stroke-width="1.5"/>
        <line x1="142" y1="132" x2="128" y2="132" stroke="rgba(10,124,140,0.4)" stroke-width="1.5"/>
        <line x1="258" y1="102" x2="272" y2="102" stroke="rgba(10,124,140,0.4)" stroke-width="1.5"/>
        <line x1="258" y1="112" x2="272" y2="112" stroke="rgba(10,124,140,0.4)" stroke-width="1.5"/>
        <line x1="258" y1="122" x2="272" y2="122" stroke="rgba(10,124,140,0.4)" stroke-width="1.5"/>
        <line x1="258" y1="132" x2="272" y2="132" stroke="rgba(10,124,140,0.4)" stroke-width="1.5"/>
        <text x="200" y="115" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#ffffff" font-weight="700" letter-spacing="1" font-family="'Share Tech Mono',monospace">MAKING /</text>
        <text x="200" y="131" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#ffffff" font-weight="700" letter-spacing="1" font-family="'Share Tech Mono',monospace">THINKING</text>
      </g>
      <!-- GATHERING/SHARING -- Transistor, right, mirrored -->

const nodes = {
  making_thinking: {
    title: 'MAKING / THINKING',
    desc: 'Sculpture, animations, games, performances,\ninteractive fabrication.\n\nThoughts on play, unstable media,\nand cybernetics critique.',
    traces: ['tr-making-thinking'],
    sections: [
      { items: [
        { l: 'MUSEUM GO ROUND', kind: 'SCULPTURE',
          body: "Museum Go Round is a musically interactive sculpture that combines a zoetrope and a praxinoscope, two pre-cinema devices that bring still images to life as they spin.\n\nI designed and built it as part of a much larger exhibit created by the <em>Children's Museum of Pittsburgh</em> and <em>Fred Rogers Productions</em>. The sculpture is meant to draw out the character trait of curiosity, and it's the home of Miss Elaina, who tends to enjoy things backwards. So its music plays both forwards and backwards.\n\nVisitors spin the pillar beneath the animations, which turns a rotary encoder wheel. An Arduino reads the wheel's speed and direction and sends them to a Raspberry Pi, where a Python audio engine treats the soundtrack like a record: a continuous playhead that runs forward or in reverse at steady speed steps, with short fades to smooth each change of direction. When no one is spinning it, it resets itself. The same motion that animates the images drives the music. The setup was inspired by Scott Garner's <em>Musical Chair</em>.\n\n<em>Built with</em> Arduino, Raspberry Pi, and Python.\n\n" + A('https://github.com/sutureblue/DJ_Wheel', 'See the code: DJ Wheel on GitHub') + "\n\n" + A('https://www.instagram.com/reel/DWm2FGdibuI/', 'Watch a video about the process'),
          img: 'assets/MGR.png', imgBelow: 'assets/MGR_2.png' },
        { l: 'LUNA PRIMA', kind: 'GAME',
          body: "Luna Prima is a game " + L(SITES.royb0t, 'royb0t') + " and I are making together. I build the game, he makes all the music, and we play it live in real time. The premise: you collect items to activate a terminal that sends a message to the Moon.\n\nWe performed with its beta at GLITCH'N'GAMES 2026. Before our set, I left slips of paper, markers, and an empty bag on a table with a sign asking people to write a message to the Moon. Thirty-one people did. At the game's finale, someone from the crowd pulled one from the bag, and that was the message typed in and sent.\n\n" + A('https://www.instagram.com/p/DeXMuHsiatX/', 'See the messages to the Moon') + "\n\nKill Screen wrote about the game and the Moon messages, the first time a game of mine has been written about as a game.\n\n" + A('https://www.instagram.com/p/DeuJ_KwlCur/', 'More about the write-up') + "\n\n<em>Coming soon: the kitbashed beta and a proto album.</em>",
          img: 'assets/LunaPrima.png' },
        { l: 'ANIMATIONS', kind: 'ANIMATION',
          body: "Since 2014, I've created looping rotoscope animations combined with analog & digital glitch techniques. My animations have been shown in Miami, Minneapolis, Chicago, Iran, Croatia, and all around the internet.\n\n" + A('https://www.instagram.com/suture.blue', 'See more on my Instagram'),
          localvideo: 'assets/icon.mp4' },

          img: 'assets/GooInBox.png' },
        { l: 'DISCUSSION GAME', kind: 'GAME',
          body: "Discussion Game is a participatory conversation game I developed and first moderated for GLITCH'N'GAMES 2024. Prompt cards guide an open-ended dialogue on glitch, control, and play.\n\nAt GLITCH'N'GAMES 2026, " + L(SITES.nickbriz, 'Nick Briz') + " and I guided it at Night City in Chicago, with participants connecting stories and ideas into a branching web of relationships that grew throughout the session. By the end of the year, I'll release an interactive version of that branching web.\n\n" + A('assets/gNg_DiscussionGame_BeeNix2024.pdf', 'Read the 2024 script') + "\n\nPhoto from 2024 by " + L(SITES.nickbriz, 'Nick Briz') + ".",
          img: 'assets/DiscussionGame.png' },

          embed: 'https://www.youtube.com/embed/R0VyONd6Eko' },
        { l: 'COLOUR ORGAN', kind: 'INSTALLATION',
          body: "Colour Organ is a digital implementation of Alexander Wallace Rimington's color-music theory, where audio frequencies trigger corresponding colored lights arranged in a 5x7 grid representing octaves and scales. The installation backlit a semi-translucent screen with 35 individual point lights programmed to respond to specific frequency ranges, creating a visual orchestration of the ROYGBIV spectrum synchronized to sound.\n\n<em>Built in Unreal Engine</em>, with all Blueprint scripting by me.\n\nColour Organ made its IRL debut at Video Sync's Video Artist Conclave in 2025.\n\n" + A('https://videosync.xyz/videoartistconclave2025', 'Video Artist Conclave 2025'),
          embed: 'https://archive.org/embed/bee-nix-colour-organ', imgBelow: 'assets/ColourOrgan.png' },

  gathering_sharing: {

    desc: 'Exhibitions, festivals, community events, curation,\nand helping make spaces that bring people together.',

      { items: [
        { l: "GLITCH'N'GAMES", kind: 'EXHIBITION',
          body: "Engaging with the glitches of a system is a form of play: the basis of my MFA thesis and the catalyst for GLITCH'N'GAMES, an exhibition series I produce and curate that places glitch art in the arcades and game spaces alongside the culture that produced it.\n\n<em>GNG'26</em> took place October 2–3, 2026, with sixteen artists across three venues in Logan Square, Chicago. Friday at Logan Arcade filled the arcade floor with playable installations, a glitch game tournament on a circuit-bent " + L(SITES.drugs, 'DRUGS™') + " console, a special appearance by Rob Sheridan, and live performances by royb0t x SutureBlue and Cocojoey. Saturday morning at Night City brought " + GO('discussing', 'talks') + " from " + L(SITES.allen, 'Allen Riley') + ", " + L(SITES.joncates, 'jonCates') + ", and " + L(SITES.rezidual, 'RezidualVizualz') + ", streamed with /'FU:BAR/, followed by the Discussion Game. The weekend closed at Chicago Gamespace with an evening around the work of Jamie Fenton, and Ms. GORF running publicly for the first time since 1982.\n\n<em>GNG'24</em> brought 40+ artists from more than five countries to two Pittsburgh venues, including LIKELIKE Arcade, co-organized with John Bumstead and Nick Liberatore.\n\n" + A('https://suture.blue/glitchngames/', 'Artists and documentation from GNG\'26'),
          imgPair: ['assets/GNG_26.png', 'assets/GNG_24.png'] },
        { l: "/'FU:BAR/", kind: 'FESTIVAL',

          img: 'assets/FubarGAC.png' },
        { l: 'GLITCH ARTISTS COLLECTIVE', kind: 'COMMUNITY',
          body: "I've been an artist/admin/curator with GAC for over ten years. Acting as a community hub that connects glitch artists globally, several of us continue to volunteer our time to create public spaces and shared resources related to glitch art and unstable media.\n\n" + A('https://linktr.ee/glitchartistscollective', 'Learn more about glitch art and GAC'),
          img: 'assets/GAC.png' },
        { l: 'GLITCHARTISDEAD III', kind: 'EXHIBITION',
          body: "GAID III happened in 2022 at the KK Berge Art Gallery, funded in part by the Southwest Minnesota Arts Council. As the 'Glitch Manager', I helped curate and produce this exhibition: 100+ artists from 13 countries, with several lectures and workshops.\n\nThe event happened in tandem with Prairie Fyre. The GAID III organizer team also included Miles Taylor, " + L(SITES.kaspar, 'Kaspar Ravel') + ", and Aleksandra Pieńkosz.\n\n" + A('https://www.instagram.com/glitchartisdead/', 'GlitchArtIsDead on Instagram'),
          img: 'assets/GAIDIII.png' },
        { l: 'MFRU 2023', kind: 'PANEL',
          body: "At MFRU 2023, I was invited to join a panel in Maribor, Slovenia on digital archiving for community, by community.\n\nMy contributions were less about my experience as an artist and more about my work as a Do-It-Together media archivist, organizing a free, downloadable, public access digital archive for the glitch art community.\n\n" + A('https://www.mfru.org/events/panel-sustainability-and-autonomy-of-digital-art', 'More about the panel'),

    ]

  discussing: {

    traces: ['tr-discussing'],
    sections: [
      { label: "/'FU:BAR/ 2K26 · CONVERSATIONS ON COLLECTIVISM", items: [
        { l: 'RÉGINE DEBATTY', kind: 'TALK', yt: VIDEOS.fubar_regine,
          body: "<em>We Just Need to Coordinate.</em> Writer, curator, and critic Régine Debatty, the blogger behind We Make Money Not Art since 2004, on two decades of writing about art and technology, and what it would take for scattered acts of resistance to become collective.\n\n" + A('https://we-make-money-not-art.com/', 'We Make Money Not Art') + watchLine(VIDEOS.fubar_regine, PLAYLISTS.fubar2k26) },

        { l: 'RGB_MTL', kind: 'TALK', yt: VIDEOS.fubar_rgbmtl,

        { l: 'GEERT LOVINK', kind: 'TALK', yt: VIDEOS.fubar_lovink,

// ======================================================
//  MAIN BOARD -- reposition outer nodes for the viewport
// ======================================================
function repositionOuterNodes() {
  const aspect = window.innerHeight / window.innerWidth;
  const VX = VB_CX, VY = VB_CY;
  const BASE = 190;
  const vOff = Math.min(Math.round(BASE * Math.max(1, aspect * 1.2)), 270);
  const hOff = Math.min(Math.round(BASE * Math.max(1, (1 / aspect) * 1.2)), 250);

  // MAKING / THINKING (top-left chip)
  const mtY = VY - vOff, mtX = 200;
  moveRect('nd-making_thinking', mtX - 58, mtY - 28, 116, 56);
  moveChipPins('nd-making_thinking', mtX, mtY);
  moveTexts('nd-making_thinking', mtX, mtY - 8, mtX, mtY + 8);
  setPoints('tr-making-thinking',
    [[mtX, mtY + 28], [mtX, VY - 46], [VX - 46, VY - 46], [VX - 46, VY]]);

  // GATHERING / SHARING (right transistor)
  const gsX = VX + hOff, gsY = VY;
  moveTransistor('nd-gathering_sharing', gsX, gsY);
  moveTexts('nd-gathering_sharing', gsX, gsY - 7, gsX, gsY + 7);
  setPoints('tr-gathering-sharing', [[VX + 46, VY], [gsX - 30, VY]]);

  // DISCUSSING (bottom crystal)
  const dX = VX, dY = VY + vOff;
  moveRect('nd-discussing', dX - 44, dY - 16, 88, 32);
  moveCrystalLines('nd-discussing', dX, dY);
  moveTexts('nd-discussing', dX, dY, null, null);
  setPoints('tr-discussing', [[VX, VY + 46], [VX, dY - 16]]);

  const junc = document.getElementById('junction');
  if (junc) { junc.setAttribute('cx', VX - 46); junc.setAttribute('cy', VY - 46); }
}

function setPoints(id, pts) {
  const el = document.getElementById(id);
  if (el) el.setAttribute('points', pts.map(p => p.join(',')).join(' '));
}
function setAttrs(el, attrs) {
  if (el) for (const k in attrs) el.setAttribute(k, attrs[k]);
}
function moveRect(groupId, x, y, w, h) {
  const g = document.getElementById(groupId);
  if (!g) return;
  setAttrs(g.querySelector('rect:not(.nhalo)'), { x, y, width: w, height: h });
  setAttrs(g.querySelector('rect.nhalo'), { x: x - 5, y: y - 5, width: w + 10, height: h + 10 });
}
function moveTexts(groupId, x1, y1, x2, y2) {
  const g = document.getElementById(groupId);
  if (!g) return;
  const texts = g.querySelectorAll('text');
  setAttrs(texts[0], { x: x1, y: y1 });
  if (texts[1] && x2 !== null) setAttrs(texts[1], { x: x2, y: y2 });
}
function moveChipPins(groupId, cx, cy) {
  const g = document.getElementById(groupId);
  if (!g) return;
  const lx = cx - 58, rx = cx + 58;
  const offsets = [-18, -6, 6, 18];
  g.querySelectorAll('line').forEach((l, i) => {
    const y = cy + offsets[i % 4];
    if (i < 4) setAttrs(l, { x1: lx, y1: y, x2: lx - 14, y2: y });
    else       setAttrs(l, { x1: rx, y1: y, x2: rx + 14, y2: y });
  });
  setAttrs(g.querySelector('path'),
    { d: `M${lx},${cy - 12} Q${lx - 6},${cy} ${lx},${cy + 12}` });
}
function moveTransistor(groupId, cx, cy) {
  const g = document.getElementById(groupId);
  if (!g) return;
  const bar = cx + 16, arm = cx - 4;
  const segs = [
    [cx + 46, cy,      cx + 30, cy     ],
    [bar,     cy - 14, bar,     cy + 14],
    [bar,     cy - 10, arm,     cy - 24],
    [arm,     cy - 24, arm,     cy - 34],
    [bar,     cy + 10, arm,     cy + 24],
    [arm,     cy + 24, arm,     cy + 34],
    [cx - 30, cy,      cx - 46, cy     ]
  ];
  const lines = g.querySelectorAll('line');
  segs.forEach(([x1, y1, x2, y2], i) => setAttrs(lines[i], { x1, y1, x2, y2 }));
  setAttrs(g.querySelector('polygon'),
    { points: `${arm + 5},${cy + 20} ${arm},${cy + 24} ${arm + 4},${cy + 29}` });
  g.querySelectorAll('circle').forEach(c => setAttrs(c, { cx, cy }));
}
function moveCrystalLines(groupId, cx, cy) {
  const g = document.getElementById(groupId);
  if (!g) return;
  const l = g.querySelectorAll('line');
  setAttrs(l[0], { x1: cx - 26, y1: cy - 16, x2: cx - 26, y2: cy + 16 });
  setAttrs(l[1], { x1: cx + 26, y1: cy - 16, x2: cx + 26, y2: cy + 16 });
  setAttrs(l[2], { x1: cx - 44, y1: cy,      x2: cx - 28, y2: cy      });
  setAttrs(l[3], { x1: cx + 28, y1: cy,      x2: cx + 44, y2: cy      });
  setAttrs(l[4], { x1: cx,      y1: cy - 16, x2: cx,      y2: cy - 19 });
}

/* Pick one 4:3 thumbnail for a cell: {type: 'img'|'video'|'none', src} */
function ytThumb(id) { return 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg'; }
function resolveThumb(item) {
  if (item.thumb && !item.yt) return { type: 'img', src: item.thumb };
  if (item.img)        return { type: 'img',   src: item.img };
  if (item.imgPair)    return { type: 'img',   src: item.imgPair[0] };
  if (item.imgBelow)   return { type: 'img',   src: item.imgBelow };
  if (item.localvideo) return { type: 'video', src: item.localvideo };
  if (item.yt)         return { type: 'img',   src: ytThumb(item.yt) };
  if (item.embed) {
    // YouTube gives a free poster frame; archive.org does not, reliably.
    const m = item.embed.match(/youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/i);
    if (m) return { type: 'img', src: ytThumb(m[1]) };
  }
  return { type: 'none', src: null };
}

function placeholder(label) {
  const ph = document.createElement('div');
  ph.className = 'cell-thumb-ph';
  ph.textContent = '[ ' + label + ' ]';
  return ph;
}

function buildCell(item) {
  const thumb = resolveThumb(item);

  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.tabIndex = 0;
  cell.setAttribute('role', 'button');
  cell.setAttribute('aria-label', item.l + (item.kind ? ' (' + item.kind.toLowerCase() + ')' : ''));

  const tw = document.createElement('div');
  tw.className = 'cell-thumb';
  if (thumb.type === 'img') {
    const im = new Image();
    im.loading = 'lazy';
    im.alt = '';
    im.onerror = () => { tw.replaceChildren(placeholder(item.l)); addKind(); };
    im.src = thumb.src;
    tw.appendChild(im);
  } else if (thumb.type === 'video') {
    const v = document.createElement('video');
    v.src = thumb.src;
    v.autoplay = true; v.muted = true; v.loop = true; v.playsInline = true;
    v.setAttribute('aria-hidden', 'true');
    tw.appendChild(v);
  } else {
    tw.appendChild(placeholder(item.l));
  }
  function addKind() {
    if (!item.kind) return;
    const k = document.createElement('span');
    k.className = 'cell-kind';
    k.textContent = item.kind;
    tw.appendChild(k);
  }
  addKind();
  cell.appendChild(tw);

  const lab = document.createElement('div');
  lab.className = 'cell-label';
  lab.textContent = item.l;
  cell.appendChild(lab);

  cell.addEventListener('click', () => openSubPanel(item, cell));
  cell.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSubPanel(item, cell); }
  });
  return cell;
}

function buildGallery(node) {
  const gal = document.getElementById('subGallery');
  gal.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'tray-head';
  const title = document.createElement('h1');
  title.className = 'tray-title';
  title.textContent = node.title;
  const sub = document.createElement('div');
  sub.className = 'tray-sub';
  sub.innerHTML = node.desc.split('\n').join('<br>');
  head.append(title, sub);
  gal.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'tray-grid';
  node.sections.forEach(sec => {
    if (sec.label) {
      const divider = document.createElement('div');
      divider.className = 'tray-section';
      const span = document.createElement('span');
      span.textContent = sec.label;
      divider.appendChild(span);
      grid.appendChild(divider);
    }
    sec.items.forEach(item => grid.appendChild(buildCell(item)));
  });

  gal.appendChild(grid);
  gal.classList.add('vis');
  applyThemeToGallery();
}

/* Skin gallery cells to the active theme via a few gallery-only CSS vars. */

  const t = THEMES[themeIndex];

    const h = rainbowHue;
    acc   = `hsla(${h}, 65%, 45%, 0.5)`;

    hatch = `hsla(${h}, 50%, 40%, 0.07)`;
    glow  = `hsla(${h}, 70%, 45%, 0.6)`;
  } else {
    acc = t.ns; bg2 = t.bg2; hatch = t.grid; glow = t.glow;
  }
  const r = document.documentElement;
  r.style.setProperty('--sp-bg2',     bg2);
  r.style.setProperty('--cell-bd',    acc);
  r.style.setProperty('--cell-hatch', hatch);
  r.style.setProperty('--cell-glow',  glow);
}

/* Snapshot the board's original SVG colors once, so every theme can
   recolor elements by their original role rather than current value. */
let svgSnapshot = null;
function snapshotSVG() {
  svgSnapshot = [];
  document.querySelectorAll('#viewMain svg *').forEach(el => {
    const snap = { el, tag: el.tagName, cls: [...el.classList] };
    ['fill', 'stroke', 'r'].forEach(a => {
      const v = el.getAttribute(a);
      if (v !== null) snap[a] = v;
    });
    svgSnapshot.push(snap);
  });
}

/* Recolor the board. `c` holds the palette roles used below. */
function paintSVG(c) {
  if (!svgSnapshot) snapshotSVG();
  svgSnapshot.forEach(s => {
    const el = s.el;
    const fill = s.fill || '', stroke = s.stroke || '';
    const r = parseFloat(s.r || '0');

    if (s.cls.includes('nhalo')) { el.setAttribute('stroke', c.acc); return; }
    if (s.tag === 'polyline') {
      if (!el.classList.contains('lit')) el.setAttribute('stroke', c.tr_c);
      return;
    }
    if (s.tag === 'circle') {
      if (r <= 4 && fill.startsWith('rgba'))  { el.setAttribute('fill', c.jc); return; }
      if (r >= 50 && fill === 'none')          { el.setAttribute('stroke', c.brd); return; }
      if (r >= 28 && /^#0[0-9a-f]/i.test(fill)) {
        if (r >= 44)      { el.setAttribute('stroke', c.acc); el.setAttribute('fill', c.bg2); }
        else if (r >= 36) { el.setAttribute('stroke', c.acc); el.setAttribute('fill', c.bg3); }
        else {
          el.setAttribute('fill', c.bg2);
          if (stroke.startsWith('rgba')) el.setAttribute('stroke', c.ns);
        }
      }
      return;
    }
    if (s.tag === 'rect') {
      if (/^#0[0-9a-f]/i.test(fill)) el.setAttribute('fill', c.bg2);
      if (stroke.startsWith('rgba'))  el.setAttribute('stroke', c.ns);
      return;
    }
    if (s.tag === 'line' || s.tag === 'path') {
      if (stroke.startsWith('rgba')) el.setAttribute('stroke', c.ns);
      return;
    }
    if (s.tag === 'polygon') { el.setAttribute('fill', c.ns); return; }
    if (s.tag === 'text') {
      if (fill === '#ffffff' || fill === 'none') return;
      if (fill === '#5ec8d4' || fill.startsWith('rgba(94,200')) { el.setAttribute('fill', c.tx); return; }
      if (fill.startsWith('rgba')) el.setAttribute('fill', c.txs);
    }
  });
}

/* Everything outside the SVG: backgrounds, grid, corners, CSS vars. */
function paintChrome(c) {
  document.body.style.background = c.bg;
  document.querySelector('.wrap').style.background = c.bg;

  let gs = document.getElementById('dyn-grid');
  if (!gs) { gs = document.createElement('style'); gs.id = 'dyn-grid'; document.head.appendChild(gs); }
  gs.textContent = `.wrap::before{background-image:linear-gradient(${c.grid} 1px,transparent 1px),linear-gradient(90deg,${c.grid} 1px,transparent 1px)!important}`;

  document.querySelectorAll('.corner').forEach(el => el.style.borderColor = c.brd);

  const r = document.documentElement;
  r.style.setProperty('--sp-bg',   c.pBg);
  r.style.setProperty('--sp-bd',   c.pBd);
  r.style.setProperty('--sp-hbg',  c.hBg);
  r.style.setProperty('--sp-hbd',  c.hBd);
  r.style.setProperty('--sp-tx',   c.tx);
  r.style.setProperty('--sp-acc',  c.ns);
  r.style.setProperty('--sp-desc', c.desc);
  r.style.setProperty('--sp-link', c.acc);
  r.style.setProperty('--sp-ibg',  c.iBg);
  r.style.setProperty('--sp-ph',   c.ph);

  let ts = document.getElementById('dyn-tr');
  if (!ts) { ts = document.createElement('style'); ts.id = 'dyn-tr'; document.head.appendChild(ts); }
  ts.textContent = `
    .tr.lit{stroke:${c.acc}!important;filter:drop-shadow(0 0 4px ${c.glow})!important}
    .cv-link,.social-btn{border-color:${c.acc}!important}
    .cv-link{color:${c.acc}!important}
    .cv-link:hover{background:${c.acc}!important;color:#fff!important}
  `;

  applyThemeToGallery();
}

function applyTheme(t) {
  paintSVG(t);
  paintChrome(t);
  const sw = document.getElementById('themeSwatch');
  if (t.rainbow) { sw.classList.add('rainbow'); sw.style.background = ''; }
  else           { sw.classList.remove('rainbow'); sw.style.background = t.swatch; sw.style.animation = ''; }
}

function rainbowPalette(h) {
  const bgH = (h + 180) % 360;
  return {
    acc:  `hsl(${h}, 70%, 45%)`,
    tx:   `hsl(${h}, 60%, 72%)`,
    txs:  `hsla(${h}, 60%, 72%, 0.5)`,
    tr_c: `hsla(${h}, 65%, 40%, 0.22)`,
    ns:   `hsla(${h}, 65%, 40%, 0.45)`,
    jc:   `hsla(${h}, 65%, 40%, 0.35)`,
    brd:  `hsla(${h}, 50%, 35%, 0.35)`,
    glow: `hsla(${h}, 70%, 45%, 0.7)`,
    grid: `hsla(${h}, 50%, 30%, 0.07)`,
    pBd:  `hsla(${h}, 60%, 40%, 0.5)`,
    hBg:  `hsla(${h}, 60%, 35%, 0.15)`,
    hBd:  `hsla(${h}, 60%, 40%, 0.4)`,
    ph:   `hsla(${h}, 60%, 40%, 0.5)`,
    desc: `hsla(${h}, 40%, 85%, 0.9)`,
    bg:   `hsl(${bgH}, 25%, 4%)`,
    pBg:  `hsl(${bgH}, 25%, 4%)`,
    bg2:  `hsl(${bgH}, 25%, 5%)`,
    bg3:  `hsl(${bgH}, 25%, 8%)`,
    iBg:  `hsl(${bgH}, 25%, 5%)`
  };
}

function rainbowTick() {
  rainbowHue = (rainbowHue + 0.25) % 360;
  const c = rainbowPalette(rainbowHue);
  paintSVG(c);
  paintChrome(c);
  const sw = document.getElementById('themeSwatch');
  sw.classList.remove('rainbow');
  sw.style.background = `hsl(${rainbowHue}, 70%, 55%)`;
  rainbowFrame = requestAnimationFrame(rainbowTick);
}

function startRainbow() { if (!rainbowFrame) rainbowTick(); }
function stopRainbow()  { if (rainbowFrame) { cancelAnimationFrame(rainbowFrame); rainbowFrame = null; } }

function cycleTheme() {
  themeIndex = (themeIndex + 1) % THEMES.length;
  const t = THEMES[themeIndex];
  stopRainbow();
  // respect reduced-motion: show rainbow as a static palette
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (t.rainbow && !still) startRainbow();
  else                     applyTheme(t);
}

// ======================================================
//  PANELS / INTERACTION
// ======================================================
function clearTraces() {
  document.querySelectorAll('.tr').forEach(t => t.classList.remove('lit'));
  document.querySelectorAll('.nhalo').forEach(h => h.classList.remove('on'));
}

function restoreFocus() {
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}

function closePanel() {
  const p = document.getElementById('panel');
  if (!p.classList.contains('vis')) return;
  p.classList.remove('vis');
  clearTraces();
  activeId = null;
  restoreFocus();
}

function setImage(src) {
  const img  = document.getElementById('pImg');
  const wrap = document.getElementById('pImgWrap');
  img.style.display = 'none';
  if (!src) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  img.onload  = () => { img.style.display = 'block'; };
  img.onerror = () => { wrap.style.display = 'none'; };
  img.src = src;
}

function activateCenter() {
  if (inSub) return;
  if (activeId === '__center') { closePanel(); return; }
  activeId = '__center';
  lastFocus = document.getElementById('nd-center');
  clearTraces();
  document.getElementById('h-center').classList.add('on');
  document.getElementById('pHeaderTitle').textContent = about.title;
  document.getElementById('pDesc').innerHTML =
    about.desc.replace(/\n/g, '<br>') + '<br><br>' +
    (about.cv ? `<a href="${about.cv}" target="_blank" rel="noopener" class="cv-link">VIEW CV →</a>` : '') +
    (about.linkedin ? `<a href="${about.linkedin}" target="_blank" rel="noopener" class="social-btn" title="LinkedIn"><img src="assets/linkedin.png" alt="LinkedIn"></a>` : '') +
    (about.instagram ? `<a href="${about.instagram}" target="_blank" rel="noopener" class="social-btn" title="Instagram"><img src="assets/instagram.png" alt="Instagram"></a>` : '');
  setImage(about.img);
  document.getElementById('panel').classList.add('vis');
  document.querySelector('#panel .p-close').focus();
}

function activateNode(id) {
  if (inSub) return;
  enterSub(id);
}

/* Key for comparing a link to the embedded video, so the panel doesn't
   show a "watch here" link pointing at the video already embedded. */
function mediaKey(url) {
  if (!url) return null;
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|live\/|v\/))([A-Za-z0-9_-]{6,})/i);
  if (m) return 'yt:' + m[1];
  m = url.match(/archive\.org\/(?:details|embed)\/([^/?#]+)/i);
  if (m) return 'ia:' + m[1];
  return null;
}
function sameMedia(href, embedSrc) {
  const a = mediaKey(href);
  return a !== null && a === mediaKey(embedSrc);
}

function makeImg(src, extraStyle) {
  const wrap = document.createElement('div');
  wrap.className = 'sub-panel-img';
  if (extraStyle) wrap.style.cssText = extraStyle;
  const im = new Image();
  im.alt = '';
  im.onload  = () => wrap.appendChild(im);
  // a missing file shows its expected path, so stand-ins are easy to spot
  im.onerror = () => { wrap.innerHTML = `<div class="sub-panel-img-ph">[ ${src} ]</div>`; };
  im.src = src;
  return wrap;
}

function openSubPanel(item, fromEl) {
  lastFocus = fromEl || document.activeElement;
  const inner = document.getElementById('subPanelInner');
  inner.innerHTML = '';

  const embed = item.yt ? 'https://www.youtube.com/embed/' + item.yt : item.embed;

  if (item.kind) {
    const k = document.createElement('div');
    k.className = 'sub-panel-kicker';
    k.textContent = item.kind;
    inner.appendChild(k);
  }

  if (embed) {
    const wrap = document.createElement('div');
    wrap.className = 'sub-panel-embed';
    const f = document.createElement('iframe');
    f.src = embed;
    f.title = item.l;
    f.loading = 'lazy';
    f.allowFullscreen = true;
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    wrap.appendChild(f);
    inner.appendChild(wrap);
  }

  if (item.localvideo) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;justify-content:center;padding:4px 0';
    const vid = document.createElement('video');
    vid.src = item.localvideo;
    vid.autoplay = true; vid.muted = true; vid.loop = true; vid.playsInline = true;
    vid.style.cssText = 'width:150px;height:150px;object-fit:cover;border-radius:6px;display:block';
    wrap.appendChild(vid);
    inner.appendChild(wrap);
  }

  if (item.img) inner.appendChild(makeImg(item.img));

  if (item.imgPair) {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;width:100%';
    item.imgPair.forEach(src => row.appendChild(makeImg(src, 'flex:1 1 0;min-width:0;height:140px')));
    inner.appendChild(row);
  }

  if (item.body) {
    let html = item.body.split('\n').join('<br>');
    // drop a trailing "watch" link that points at the embedded video
    if (embed) {
      const parts = html.split('<br><br>');
      const last  = parts[parts.length - 1];
      const href  = last.trim().startsWith('<a ') && last.match(/href=['"]([^'"]+)['"]/i);
      if (parts.length > 1 && href && sameMedia(href[1], embed)) {
        parts.pop();
        html = parts.join('<br><br>');
      }
    }
    const txt = document.createElement('div');
    txt.className = 'sub-panel-text';
    txt.innerHTML = html;
    inner.appendChild(txt);
  }

  if (item.imgBelow) inner.appendChild(makeImg(item.imgBelow));

  document.getElementById('subPanelTitle').textContent = item.l;
  document.querySelector('#subPanel .sub-panel-body').scrollTop = 0;
  document.getElementById('subPanel').classList.add('vis');
  document.querySelector('#subPanel .p-close').focus();
}

function closeSubPanel() {
  const p = document.getElementById('subPanel');
  if (!p.classList.contains('vis')) return;
  p.classList.remove('vis');
  // emptying the panel removes the iframe/video, which stops playback
  document.getElementById('subPanelInner').innerHTML = '';
  restoreFocus();
}

function enterSub(id) {
  const n = nodes[id];
  if (!n) return;

  buildGallery(n);
  clearTraces();
  const trace = document.getElementById(n.traces[0]);
  if (trace) trace.classList.add('lit');

  const main = document.getElementById('viewMain');
  const sub  = document.getElementById('viewSub');
  inSub = true;
  main.style.opacity = '0';
  setTimeout(() => {
    main.classList.add('hidden');
    sub.classList.remove('hidden');
    sub.style.opacity = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => { sub.style.opacity = '1'; }));
    const home = document.getElementById('homeBtn');
    home.classList.add('vis');
    home.focus();
  }, 350);
}

function goHome() {
  closePanel();
  closeSubPanel();
  const main = document.getElementById('viewMain');
  const sub  = document.getElementById('viewSub');
  const from = activeNodeId;
  sub.style.opacity = '0';
  setTimeout(() => {
    sub.classList.add('hidden');
    main.classList.remove('hidden');
    main.style.opacity = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => { main.style.opacity = '1'; }));
    inSub = false;
    activeId = null;
    document.getElementById('homeBtn').classList.remove('vis');
    const gal = document.getElementById('subGallery');
    gal.classList.remove('vis');
    gal.innerHTML = '';   // stops any looping thumbnail videos
    clearTraces();
    const back = from && document.getElementById('nd-' + from);
    if (back) back.focus();
  }, 300);
}

// ======================================================
//  INPUT: board nodes (click + keyboard) and Escape
// ======================================================
document.querySelectorAll('#viewMain .nd').forEach(g => {
  const go = () => {
    const a = g.dataset.action;
    if (a === 'center') activateCenter();
    else { activeNodeId = a; activateNode(a); }
  };
  g.addEventListener('click', go);
  g.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
  });
});

/* Links inside a panel that point at another section of the site
   (made with GO() in the content data) switch the gallery in place. */
document.getElementById('subPanelInner').addEventListener('click', e => {
  const a = e.target.closest('a[data-goto]');
  if (!a) return;
  e.preventDefault();
  switchSection(a.dataset.goto);
});

function switchSection(id) {
  const n = nodes[id];
  if (!n) return;
  lastFocus = null;
  closeSubPanel();
  activeNodeId = id;
  buildGallery(n);
  clearTraces();
  const trace = document.getElementById(n.traces[0]);
  if (trace) trace.classList.add('lit');
  const first = document.querySelector('#subGallery .cell');
  if (first) first.focus({ preventScroll: true });
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('subPanel').classList.contains('vis')) closeSubPanel();
  else if (document.getElementById('panel').classList.contains('vis')) closePanel();
  else if (inSub) goHome();
});

// ======================================================
//  INIT
// ======================================================
document.getElementById('themeSwatch').style.background = THEMES[0].swatch;
applyThemeToGallery();
repositionOuterNodes();
snapshotSVG();
// fonts can shift layout slightly once loaded
if (document.fonts && document.fonts.ready) document.fonts.ready.then(repositionOuterNodes);
</script>
</body>
